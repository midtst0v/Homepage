  <body>
    <div class="header">
      <span class="pageTitle">MDTX.cc</span>
      <form method="get" class="musicCtl">
        <input type="checkbox" name="bgmPlaying" id="musicToggle">
        <label for="musicToggle">Music</label>
      </form>
    </div>

    <div class="nav">
      <div class="blockade">
        UNDER CONSTRUCTION

      <ul class="navList">

      <div id="webring"></div>

    <div class="content">
      <article>
        <header>
          <span class="pageTitle">Home</span>
        </header>

        <p>nothing captivating yet</p>
        <img src="assets/img/raycat_flip.gif" alt="test">
      </article>

    <div class="footer">
      <span class="copyright">midtst0v &copy; 2026</span>
    </div>

    <audio src="https://jetta.vgmtreasurechest.com/soundtracks/kirby-s-kira-kira-kids-1998-snes/ajtrbjqb/34%20Ending%20~%20Credits.mp3" id="music" loop></audio>
    <script>
      let music = document.getElementById("music");
      let musicToggle = document.getElementById("musicToggle");

      let bgmLabel = document.getElementsByTagName("label")[0];
      let bgmLabelDefaultText = bgmLabel.textContent;

      musicToggle.onchange = function(e) 
      {
        if(this.checked)
        {
          music.play();
          bgmLabel.innerHTML = "<strong>PLAYING:</strong> Kirby's Star Stacker - Ending Credits";
        }
        else
        {
          music.pause();
          bgmLabel.textContent = bgmLabelDefaultText;
        }
      };
    </script>
  </body>
