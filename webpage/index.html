<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mdtx.cc - UNDER CONSTRUCTION</title>
    <link rel="icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/webring.js" defer></script>
  </head>

  <body>
    <article style="display: flex; flex-direction: column; align-items: center;">
      <span id="pageTitle">
        <p>MDTX.cc [UNDER CONSTRUCTION]</p>
        <form method="get" style="display: flex; flex-direction: row; align-items: flex-start;">
          <input type="checkbox" name="bgmPlaying" id="musicToggle">
          <label for="musicToggle">Music</label>
        </form>
      </span>
      <img src="assets/img/raycat_flip.gif" style="margin: 64px;">
    </article>
    
    <audio src="https://jetta.vgmtreasurechest.com/soundtracks/kirby-s-kira-kira-kids-1998-snes/ajtrbjqb/34%20Ending%20~%20Credits.mp3" type="audio/mp3" id="music" loop></audio>
    
    <div id="webring">
    </div>

    <script>
      let music = document.getElementById("music");
      let musicToggle = document.getElementById("musicToggle");

      let bgmLabel = document.getElementsByTagName("label")[0];
      let bgmLabelDefaultText = bgmLabel.textContent;

      musicToggle.onchange = function(e) 
      {
        if(this.checked)
        {
          music.play();
          bgmLabel.innerHTML = "<strong>PLAYING:</strong> Kirby's Star Stacker - Ending Credits";
        }
        else
        {
          music.pause();
          bgmLabel.textContent = bgmLabelDefaultText;
        }
      };
    </script>
  </body>
</html>
